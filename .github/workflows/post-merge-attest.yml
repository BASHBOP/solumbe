name: Post-merge audit attestation

# Run only after solumbe CI has completed successfully. For ordinary main
# pushes, the completed push workflow supplies the exact commit. Dependabot
# auto-merges performed with GITHUB_TOKEN do not emit another push workflow,
# so the completed PR workflow is also reconciled once GitHub reports it merged.
on:
  workflow_run:
    workflows: ["solumbe CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Main commit to reconcile through (defaults to origin/main)
        required: false
        type: string
      reset_ledger:
        description: >-
          Archive a ledger whose commits are no longer in this history and start a new chain at the target. Only for the "not in this repository" failure.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: solumbe-post-merge-audit-ledger
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
          (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))

    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Resolve merged main commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          echo "should_run=false" >> "$GITHUB_OUTPUT"

          TARGET_SHA=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="${REQUESTED_SHA:-main}"
          elif [ "$RUN_EVENT" = "push" ] && [ "$RUN_HEAD_BRANCH" = "main" ]; then
            TARGET_SHA="$RUN_HEAD_SHA"
          elif [ "$RUN_EVENT" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            ATTEMPTS=1
            if [ "$RUN_ACTOR" = "dependabot[bot]" ]; then
              ATTEMPTS=6
            fi
            for attempt in $(seq 1 "$ATTEMPTS"); do
              MERGED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged_at // ""')"
              if [ -n "$MERGED_AT" ]; then
                # Only a merge into main belongs in the main ledger. A PR into
                # develop whose CI finished after it merged used to resolve to
                # its develop merge commit and write develop's line into it.
                BASE_REF="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
                if [ "$BASE_REF" = "main" ]; then
                  TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')"
                else
                  echo "PR #${PR_NUMBER} merged into ${BASE_REF}, not main: nothing to attest."
                fi
                break
              fi
              if [ "$attempt" -lt "$ATTEMPTS" ]; then
                sleep 5
              fi
            done
          fi

          if [ -z "$TARGET_SHA" ]; then
            echo "No merged main commit is associated with this completed workflow."
            exit 0
          fi

          TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" --jq '.sha')"
          SHORT_SHA="$(printf '%s' "$TARGET_SHA" | cut -c1-12)"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  # The attestation itself is the reusable workflow any repository can call.
  # solumbe runs it on its own merged commit, so the engine that attests a
  # commit is the one that commit ships.
  attest:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    uses: ./.github/workflows/attest.yml
    with:
      target_sha: ${{ needs.resolve.outputs.target_sha }}
      solumbe_repository: ${{ github.repository }}
      solumbe_ref: ${{ needs.resolve.outputs.target_sha }}
      # Resetting the audit chain is a decision, so only a person starting
      # the workflow by hand can ask for it; a CI-triggered run never can.
      reset_ledger: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_ledger || false }}
    secrets:
      # Set SOLUMBE_ATTEST_KEY (an Ed25519 private key, PEM) in the repository's
      # secrets to sign the ledger; records are unsigned until then.
      attest_key: ${{ secrets.SOLUMBE_ATTEST_KEY }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
      statuses: write
